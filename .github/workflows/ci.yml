name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run unit + generated E2E tests
        run: pytest --cov=e2e_ai --cov-report=term-missing

      - name: Smoke-test CLI code generation
        run: |
          e2e-ai generate examples/login_scenario.txt --out /tmp/test_cli_generated.py --name cli_smoke
          python -c "compile(open('/tmp/test_cli_generated.py').read(), '<gen>', 'exec')"
